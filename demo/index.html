  <body>
    <main id="demo">
      <noscript>
        <h1>Slipstream</h1>
        <p>
          An FFGL source and an effect for jumping to hyperspace: a camera
          flying through space with its shutter open, so the stars stretch into
          streaks because the camera moves while the shutter's open, which is
          all the films' hyperspace ever was. Four looks: Hyperspace, a Warp
          jump with its rubber band and flash, a Wormhole of whirling cloud, and
          a Black Hole done properly, with its shadow, a lensed sky (or your
          clip bent into an Einstein ring), a disc whose far side is lensed over
          the top, and a photon ring that nothing draws.
        </p>
        <p>
          This demo runs the plugin's shaders and a port of its CPU half in your
          browser, so it needs JavaScript and WebGL2. The plugin itself, its
          source and its downloads are on
          <a href="https://github.com/stoatworks-labs/slipstream">its repository</a>.
        </p>
        <ul>
